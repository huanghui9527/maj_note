---
layout: default
title: M-League 前日战绩
---

<link rel="icon" type="image/png" href="https://m-league.jp/assets/media/img/common/favicon_64-64.png">

<style>
  body {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    font-size: 17px;
  }
  .ml-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 24px 0 4px;
  }
  .ml-head h1 {
    font-size: 26px;
    margin: 0;
    padding-left: 12px;
    border-left: 4px solid #5b7bd5;
  }
  .ml-head a { font-size: 15px; color: #5b7bd5; text-decoration: none; }
  .ml-head a:hover { text-decoration: underline; }
  .ml-date {
    font-size: 15px;
    color: #888;
    margin-bottom: 18px;
  }
  .ml-sub {
    font-size: 18px;
    font-weight: 600;
    margin: 24px 0 10px;
    color: #444;
  }
  .ml-table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .ml-table th, .ml-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #eee; }
  .ml-table th { color: #888; font-weight: 500; font-size: 14px; }
  .ml-table td.num, .ml-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ml-badge {
    width: 28px;
    height: 28px;
    vertical-align: -8px;
    margin-right: 8px;
    object-fit: contain;
  }
  .ml-two {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
  }
  .ml-mvp {
    font-size: 16px;
    background: #f5f7fb;
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 18px;
  }
  .ml-mvp b { color: #b3261e; }
  .ml-empty { color: #888; font-size: 16px; padding: 8px 0; }
  .ml-error { color: #b3261e; font-size: 16px; padding: 8px 0; }
  .ml-hands { margin: 4px 0 20px; font-size: 15px; }
  .ml-hands summary {
    cursor: pointer;
    color: #5b7bd5;
    font-weight: 600;
    padding: 6px 0;
    user-select: none;
  }
  .ml-hands summary:hover { text-decoration: underline; }
  .ml-hands-t { font-size: 14px; }
  .ml-hands-t td, .ml-hands-t th { padding: 6px 8px; }
  .ml-kyoku { white-space: nowrap; color: #555; }
  .ml-seat-t { font-weight: 400; font-size: 12px; color: #999; }
  .ml-pos { color: #1a7f37; background: #e9f6ee; }
  .ml-neg { color: #b3261e; background: #fdeeee; }
  .ml-ev { color: #666; font-size: 13px; }
  .ml-src { margin-top: 10px; font-size: 13px; color: #999; }
  .ml-src a { color: #5b7bd5; text-decoration: none; }
  .ml-src a:hover { text-decoration: underline; }
</style>

<div class="ml-head">
  <h1>M-League 前日战绩</h1>
  <a href="https://m-league.jp/games" target="_blank">官网 ↗</a>
</div>
<div class="ml-date" id="ml-date"></div>
<div id="ml-body"><div class="ml-empty">读取中…</div></div>

<script>
(async function () {
  const body = document.getElementById("ml-body");
  const dateEl = document.getElementById("ml-date");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let d = null;
  try {
    const r = await fetch("mleague.json?v=" + Date.now());
    if (r.ok) d = await r.json();
  } catch (e) {}
  if (!d) {
    body.innerHTML = `<div class="ml-error">mleague.json 读取失败（由 GitHub Actions 定时抓取生成，需与页面同目录部署）</div>`;
    return;
  }

  dateEl.textContent = `数据时间：${d.fetchedAt ? d.fetchedAt.slice(0, 16).replace("T", " ") : "-"} UTC`;

  const fmt = (n) => (n > 0 ? "+" + n : String(n));
  // 队标小图（m-league.jp 相对路径转绝对 URL，加载失败时隐藏）
  const badge = (img) => img
    ? `<img class="ml-badge" src="https://m-league.jp${esc(img)}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : "";
  let html = `<div class="ml-sub">${esc(d.date)}（日本时间）${d.hasGames ? ` · 共${d.gamesCount}試合` : ""}</div>`;

  // 逐局明细：得点/失点直接用实际点数（正绿负红区分）
  const handPt = (x) => (x > 0 ? "+" + x : String(x));
  const handEv = (ev) => {
    if (ev.winner) {
      let s = `${ev.winner} ${ev.type || ""}${ev.points ? " " + ev.points + "点" : ""}${ev.fu ? " " + ev.fu : ""}${ev.yaku ? "・" + ev.yaku : ""}`;
      return s.trim();
    }
    let s = ev.type || "流局";
    if (ev.tenpai) s += `（テンパイ: ${ev.tenpai}）`;
    return s;
  };
  const handsBlock = (g) => {
    if (!g.hands || !g.hands.length) return "";
    const teams = {};
    for (const p of g.players || []) teams[p.name.replace(/\s+/g, "")] = p.team;
    const head = g.seats.map((n) => {
      const t = teams[n.replace(/\s+/g, "")];
      return `<th>${esc(n)}${t ? `<br><span class="ml-seat-t">${esc(t)}</span>` : ""}</th>`;
    }).join("");
    const rows = g.hands.map((h) => {
      const evs = (h.events || []).map(handEv).join("；");
      const tds = h.delta.map((x) =>
        `<td class="num ${x > 0 ? "ml-pos" : x < 0 ? "ml-neg" : ""}">${handPt(x)}</td>`).join("");
      return `<tr><td class="ml-kyoku">${esc(h.kyoku)}</td>${tds}<td class="ml-ev">${esc(evs || "—")}</td></tr>`;
    }).join("");
    return `<details class="ml-hands">
      <summary>逐局明细（${g.hands.length}把）</summary>
      <table class="ml-table ml-hands-t">
        <tr><th>局</th>${head}<th>明细</th></tr>
        ${rows}
      </table>
      ${g.statsUrl ? `<div class="ml-src">数据源：<a href="${esc(g.statsUrl)}" target="_blank">麻雀ウォッチ スタッツ ↗</a></div>` : ""}
    </details>`;
  };

  if (!d.hasGames) {
    html += `<div class="ml-empty">前一日无比赛</div>`;
  } else {
    // 各卓逐局结果（按卓分组）
    const desks = [...new Set(d.games.map((g) => g.desk))].sort();
    for (const desk of desks) {
      const gs = d.games.filter((g) => g.desk === desk);
      const label = desk === 0 ? "A卓" : desk === 1 ? "B卓" : `卓${desk}`;
      html += `<div class="ml-sub">${label}</div>`;
      html += gs.map((g) => `
        <table class="ml-table">
          <tr><th>第${g.no}試合</th><th>队伍</th><th class="num">pt</th></tr>
          ${g.players.map((p) => `
            <tr>
              <td>${p.rank}位 ${esc(p.name)}</td>
              <td>${badge(p.img)}${esc(p.team)}</td>
              <td class="num">${fmt(p.point)}</td>
            </tr>`).join("")}
        </table>${handsBlock(g)}`).join("");
    }
    // 当日队伍合计
    html += `<div class="ml-sub">当日队伍合计</div>
      <table class="ml-table">
        <tr><th>队伍</th><th class="num">pt</th><th class="num">1着</th><th class="num">4着</th></tr>
        ${d.teamDay.map((t) => `
          <tr>
            <td>${badge(t.img)}${esc(t.team)}</td>
            <td class="num">${fmt(t.points)}</td>
            <td class="num">${t.tops}</td>
            <td class="num">${t.lasts}</td>
          </tr>`).join("")}
      </table>`;
    if (d.dayMVP) {
      html += `<div class="ml-mvp">当日最佳：<b>${esc(d.dayMVP.name)}</b>（${badge(d.dayMVP.img)}${esc(d.dayMVP.team)}）${fmt(d.dayMVP.point)} pt</div>`;
    }
    // 赛季排名（两栏：队伍全量 + 个人全量）
    if (d.standings && d.standings.teams && d.standings.teams.length) {
      html += `<div class="ml-sub">赛季排名</div>
        <div class="ml-two">
          <table class="ml-table">
            <tr><th colspan="3">队伍</th></tr>
            ${d.standings.teams.map((t) => `
              <tr><td>${t.rank}</td><td>${badge(t.img)}${esc(t.name)}</td><td class="num">${fmt(t.points)}</td></tr>`).join("")}
          </table>
          <table class="ml-table">
            <tr><th colspan="3">个人スコア</th></tr>
            ${d.standings.players.map((p) => `
              <tr><td>${p.rank}</td><td>${esc(p.name)}</td><td class="num">${fmt(p.points)}</td></tr>`).join("")}
          </table>
        </div>`;
    }
  }
  body.innerHTML = html;
})();
</script>
