---
layout: default
title: 麻将笔记
---

<style>
  #app section { margin-bottom: 36px; }
  #app section > h2 {
    font-size: 18px;
    margin: 28px 0 12px;
    padding-left: 10px;
    border-left: 4px solid #5b7bd5;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
    transition: transform .15s;
    display: flex;
    flex-direction: column;
  }
  .card:hover { transform: translateY(-2px); }
  .card a { display: block; }
  .card img {
    display: block;
    width: 100%;
    height: 240px;
    object-fit: contain;
    background: #eef0f3;
  }
  .note {
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.6;
    border-top: 1px solid #eee;
    flex: 1;
  }
  .note .placeholder { color: #aaa; }
  .note .title {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
  }
  /* 雀魂战绩卡片 */
  .profile-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
    padding: 16px 20px;
    margin-bottom: 28px;
  }
  .profile-card .pc-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .profile-card .pc-head h2 {
    font-size: 18px;
    margin: 0;
    padding-left: 10px;
    border-left: 4px solid #5b7bd5;
  }
  .profile-card .pc-head a {
    font-size: 13px;
    color: #5b7bd5;
    text-decoration: none;
  }
  .profile-card .pc-head a:hover { text-decoration: underline; }
  .pc-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .pc-stats .stat {
    flex: 1;
    min-width: 120px;
    background: #f5f7fb;
    border-radius: 8px;
    padding: 12px 16px;
    text-align: center;
  }
  .pc-stats .stat b {
    display: block;
    font-size: 24px;
    line-height: 1.3;
  }
  .pc-stats .stat i {
    font-style: normal;
    font-size: 12px;
    color: #888;
  }
</style>

<div class="profile-card" id="profile-card" hidden>
  <div class="pc-head">
    <h2>雀魂战绩</h2>
    <a id="pc-link" href="https://amae-koromo.sapk.ch/player/17417542/12" target="_blank">牌谱屋 ↗</a>
  </div>
  <div class="pc-stats">
    <span class="stat"><b id="pc-level">-</b><i>段位</i></span>
    <span class="stat"><b id="pc-score">-</b><i>分数</i></span>
    <span class="stat"><b id="pc-updated">-</b><i>数据更新</i></span>
  </div>
</div>

<div id="app"></div>

<script>
// ==================== 雀魂战绩配置（兜底数据） ====================
// 页面优先读取 stats.json（由 GitHub Actions 每 6 小时自动抓取牌谱屋生成）。
// 本地直接打开 html 或抓取失败时，才会使用下面的手动配置：
// 手动查看：https://amae-koromo.sapk.ch/player/17417542/12
const PROFILE = {
  name: "",     // 昵称
  level: "",    // 段位，例："四段"
  score: "",    // 分数，例："1820"
  updated: "",  // 数据更新日期，例："2026-09-18"
};

// ==================== 数据配置 ====================
// 新增内容时在这里添加，页面上文件夹按数组顺序显示（新的放前面即可）
// 结构：{ folder: "文件夹名", images: [{ file: "文件名", title: "标题", note: "备注" }] }
const DATA = [
  {
    folder: "2026917",
    images: [
      { file: "点绝张对对.png", title: "点绝张对对", note: "2m点对对。选择下车就不要报侥幸心理，23s顺切下车" },
      { file: "牌效.png", title: "牌效", note: "牌效错误，唯一5p。有27s进张" },
    ],
  },
];
// =================================================

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// 渲染雀魂战绩卡片：优先读取 stats.json（GitHub Actions 定时抓取），失败用手动配置兜底
(async function renderProfile() {
  const card = document.getElementById("profile-card");
  let d = null;
  try {
    const r = await fetch("stats.json?v=" + Date.now());
    if (r.ok) d = await r.json();
  } catch (e) {}
  if (!d) d = PROFILE; // stats.json 不存在时用手动配置兜底
  if (!d.level && !d.score) return; // 无数据则隐藏
  if (d.name) card.querySelector("h2").textContent = "雀魂战绩 · " + d.name;
  document.getElementById("pc-level").textContent = d.level || "-";
  document.getElementById("pc-score").textContent = d.score || "-";
  document.getElementById("pc-updated").textContent = d.updated ? d.updated.slice(0, 10) : "-";
  card.hidden = false;
})();

for (const { folder, images } of DATA) {
  const section = document.createElement("section");
  const cards = images.map(({ file, title, note }) => `
    <div class="card">
      <a href="${esc(folder)}/${esc(file)}" target="_blank" title="${esc(file)}">
        <img src="${esc(folder)}/${esc(file)}" alt="${esc(file)}" loading="lazy">
      </a>
      <div class="note">
        <div class="title">${title ? esc(title) : '<span class="placeholder">（无标题）</span>'}</div>
        ${note ? esc(note) : '<span class="placeholder">（暂无备注）</span>'}
      </div>
    </div>`).join("");
  section.innerHTML = `<h2>${esc(folder)}</h2><div class="grid">${cards}</div>`;
  app.appendChild(section);
}
</script>
