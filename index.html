<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻将笔记 · maj_note</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #222;
  }
  header {
    padding: 20px 24px;
    background: #1f2430;
    color: #fff;
  }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; opacity: .6; font-size: 13px; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }
  section { margin-bottom: 36px; }
  section > h2 {
    font-size: 16px;
    margin: 0 0 12px;
    padding-left: 10px;
    border-left: 4px solid #5b7bd5;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    transition: transform .15s;
    display: flex;
    flex-direction: column;
  }
  .card:hover { transform: translateY(-2px); }
  .card a { display: block; }
  .card img {
    display: block;
    width: 100%;
    height: 240px;
    object-fit: contain;
    background: #eef0f3;
  }
  .note {
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.6;
    border-top: 1px solid #eee;
    flex: 1;
  }
  .note .placeholder { color: #aaa; }
</style>
</head>
<body>
<header>
  <h1>麻将笔记</h1>
  <p>按文件夹归档的对局截图与备注</p>
</header>
<main id="app"></main>

<script>
// ==================== 数据配置 ====================
// 新增内容时在这里添加，页面上文件夹按数组顺序显示（新的放前面即可）
// 结构：{ folder: "文件夹名", images: [{ file: "文件名", note: "备注" }] }
const DATA = [
  {
    folder: "2026917",
    images: [
      { file: "点绝张对对.png", note: "2m点对对.选择下车就不要报侥幸心理,23s顺切下车" },
      { file: "牌效.png", note: "牌效错误,唯一5p" },
    ],
  },
];
// =================================================

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

for (const { folder, images } of DATA) {
  const section = document.createElement("section");
  const cards = images.map(({ file, note }) => `
    <div class="card">
      <a href="${esc(folder)}/${esc(file)}" target="_blank" title="${esc(file)}">
        <img src="${esc(folder)}/${esc(file)}" alt="${esc(file)}" loading="lazy">
      </a>
      <div class="note">${note ? esc(note) : '<span class="placeholder">（暂无备注）</span>'}</div>
    </div>`).join("");
  section.innerHTML = `<h2>${esc(folder)}</h2><div class="grid">${cards}</div>`;
  app.appendChild(section);
}
</script>
</body>
</html>
