---
layout: default
title: 麻将笔记
---

<style>
  #app section { margin-bottom: 36px; }
  #app section > h2 {
    font-size: 18px;
    margin: 28px 0 12px;
    padding-left: 10px;
    border-left: 4px solid #5b7bd5;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
    transition: transform .15s;
    display: flex;
    flex-direction: column;
  }
  .card:hover { transform: translateY(-2px); }
  .card a { display: block; }
  .card img {
    display: block;
    width: 100%;
    height: 240px;
    object-fit: contain;
    background: #eef0f3;
  }
  .note {
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.6;
    border-top: 1px solid #eee;
    flex: 1;
  }
  .note .placeholder { color: #aaa; }
  .note .title {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
  }
</style>

<div id="app"></div>

<script>
// ==================== 数据配置 ====================
// 新增内容时在这里添加，页面上文件夹按数组顺序显示（新的放前面即可）
// 结构：{ folder: "文件夹名", images: [{ file: "文件名", title: "标题", note: "备注" }] }
const DATA = [
  {
    folder: "2026917",
    images: [
      { file: "点绝张对对.png", title: "点绝张对对", note: "2m点对对。选择下车就不要报侥幸心理，23s顺切下车" },
      { file: "牌效.png", title: "牌效", note: "牌效错误，唯一5p。有27s进张" },
    ],
  },
];
// =================================================

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

for (const { folder, images } of DATA) {
  const section = document.createElement("section");
  const cards = images.map(({ file, title, note }) => `
    <div class="card">
      <a href="${esc(folder)}/${esc(file)}" target="_blank" title="${esc(file)}">
        <img src="${esc(folder)}/${esc(file)}" alt="${esc(file)}" loading="lazy">
      </a>
      <div class="note">
        <div class="title">${title ? esc(title) : '<span class="placeholder">（无标题）</span>'}</div>
        ${note ? esc(note) : '<span class="placeholder">（暂无备注）</span>'}
      </div>
    </div>`).join("");
  section.innerHTML = `<h2>${esc(folder)}</h2><div class="grid">${cards}</div>`;
  app.appendChild(section);
}
</script>
